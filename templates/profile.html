{% extends "base.html" %}

{% block title %}My Profile - Vortex Marketplace{% endblock %}

{% block content %}
<header>
    <div class="logo">MY PROFILE</div>
    <p class="tagline">Account Settings</p>
</header>

<div style="max-width: 600px; margin: 30px auto;">
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <div class="block">
        <div class="block-title">
            <span class="block-icon">👤</span>
            PROFILE INFORMATION
        </div>

        <div class="block-stats">
            <div class="stat">
                <div class="stat-value">{{ user.likes }}</div>
                <div class="stat-label">Likes</div>
            </div>
            <div class="stat">
                <div class="stat-value">{% if user.verified %}✓{% else %}✗{% endif %}</div>
                <div class="stat-label">Verified</div>
            </div>
        </div>

        <form method="POST" action="{{ url_for('update_profile') }}" style="background: transparent; border: none; padding: 0;">
            <label>Username:</label>
            <input type="text" name="username" value="{{ user.username }}" required>

            <label>Bitcoin Wallet:</label>
            <input type="text" name="wallet" value="{{ user.wallet }}" required>

            <button type="submit" style="width: 100%; margin-top: 20px;">UPDATE PROFILE</button>
        </form>
    </div>
</div>

<div style="text-align: center; margin-top: 30px;">
    <a href="{{ url_for('main_menu') }}" class="btn btn-secondary">BACK</a>
</div>
{% endblock %}
